name: Parlamentsgeschaefte aktualisieren

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions verwendet UTC.
    # 17:30 UTC = 19:30 MESZ / 18:30 MEZ.
    # Für eine ganzjährig konstante Schweizer Lokalzeit wären zwei
    # saisonale Zeitpläne nötig. Für den Start ist dieser Lauf bewusst simpel.
    - cron: "30 17 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Daten aktualisieren
        run: python scraper.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geschaefte.json
          git diff --cached --quiet && exit 0
          git commit -m "Parlamentsgeschaefte aktualisieren"
          git push
