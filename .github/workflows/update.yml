name: Parlamentsgeschaefte aktualisieren

on:
  workflow_dispatch:
  schedule:
    # Stündlich von 08:17 bis 19:17 UTC.
    # Schweizer Zeit:
    # Sommer: 10:17 bis 21:17
    # Winter: 09:17 bis 20:17
    - cron: "17 8-19 * * *"

permissions:
  contents: write

concurrency:
  group: parlamentsgeschaefte-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Daten aktualisieren
        run: |
          echo "Scraper gestartet:"
          TZ=Europe/Zurich date
          python scraper.py
          echo "Scraper erfolgreich beendet."

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/geschaefte.json

          if git diff --cached --quiet; then
            echo "Keine Datenänderungen vorhanden."
            exit 0
          fi

          git commit -m "Parlamentsgeschaefte aktualisieren"
          git push

          echo "Änderungen erfolgreich gespeichert."
